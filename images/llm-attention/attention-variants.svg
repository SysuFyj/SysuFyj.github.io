<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">MHA GQA MQA attention variants</title><desc id="desc">MHA has one key-value pair per query head, GQA shares key-value pairs within groups, and MQA shares one key-value pair across all query heads.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18212b}.h{font-size:25px;font-weight:700}.s{font-size:20px}.t{font-size:17px}.box{fill:#f5f8fb;stroke:#4b6b88;stroke-width:2;rx:10}.q{fill:#eaf2ff;stroke:#4777ae;stroke-width:2;rx:8}.kv{fill:#fff6df;stroke:#c28b20;stroke-width:2;rx:8}.arrow{stroke:#536779;stroke-width:2;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#536779"/></marker></defs>
<text x="40" y="42" class="h">只改变 K/V 的共享方式：查询头仍然可以保持多个</text>
<g transform="translate(35 75)"><rect width="350" height="300" class="box"/><text x="175" y="35" text-anchor="middle" class="h">MHA</text><text x="175" y="62" text-anchor="middle" class="t">每个 Q head 都有自己的 K/V</text>
<g transform="translate(35 90)"><rect width="80" height="42" class="q"/><text x="40" y="27" text-anchor="middle" class="t">Q₁</text><rect x="120" width="80" height="42" class="kv"/><text x="160" y="27" text-anchor="middle" class="t">K₁V₁</text><path d="M80 21 H118" class="arrow"/><rect x="0" y="65" width="80" height="42" class="q"/><text x="40" y="92" text-anchor="middle" class="t">Q₂</text><rect x="120" y="65" width="80" height="42" class="kv"/><text x="160" y="92" text-anchor="middle" class="t">K₂V₂</text><path d="M80 86 H118" class="arrow"/><rect x="0" y="130" width="80" height="42" class="q"/><text x="40" y="157" text-anchor="middle" class="t">Q₃</text><rect x="120" y="130" width="80" height="42" class="kv"/><text x="160" y="157" text-anchor="middle" class="t">K₃V₃</text><path d="M80 151 H118" class="arrow"/></g></g>
<g transform="translate(425 75)"><rect width="350" height="300" class="box"/><text x="175" y="35" text-anchor="middle" class="h">GQA</text><text x="175" y="62" text-anchor="middle" class="t">多个 Q head 共享一组 K/V</text><g transform="translate(35 90)"><rect width="80" height="42" class="q"/><text x="40" y="27" text-anchor="middle" class="t">Q₁</text><rect x="120" width="110" height="42" class="kv"/><text x="175" y="27" text-anchor="middle" class="t">K₁V₁</text><path d="M80 21 H118" class="arrow"/><rect x="0" y="65" width="80" height="42" class="q"/><text x="40" y="92" text-anchor="middle" class="t">Q₂</text><path d="M80 86 H118" class="arrow"/><rect x="0" y="130" width="80" height="42" class="q"/><text x="40" y="157" text-anchor="middle" class="t">Q₃</text><path d="M80 151 H118" class="arrow"/><rect x="120" y="130" width="110" height="42" class="kv"/><text x="175" y="157" text-anchor="middle" class="t">K₂V₂</text><path d="M80 151 H118" class="arrow"/></g></g>
<g transform="translate(815 75)"><rect width="350" height="300" class="box"/><text x="175" y="35" text-anchor="middle" class="h">MQA</text><text x="175" y="62" text-anchor="middle" class="t">所有 Q head 共享一组 K/V</text><g transform="translate(35 105)"><rect width="80" height="42" class="q"/><text x="40" y="27" text-anchor="middle" class="t">Q₁</text><rect x="120" width="130" height="82" class="kv"/><text x="185" y="36" text-anchor="middle" class="t">K V</text><text x="185" y="62" text-anchor="middle" class="t">唯一共享组</text><path d="M80 21 H118" class="arrow"/><rect y="65" width="80" height="42" class="q"/><text x="40" y="92" text-anchor="middle" class="t">Q₂</text><path d="M80 86 H118" class="arrow"/><rect y="130" width="80" height="42" class="q"/><text x="40" y="157" text-anchor="middle" class="t">Q₃</text><path d="M80 151 H118" class="arrow"/></g></g>
</svg>
