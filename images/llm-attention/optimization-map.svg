<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Attention optimization map</title><desc id="desc">Optimization methods reduce cost by gating outputs, compressing states, maintaining recurrent states, or selecting a sparse subset of tokens.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18212b}.h{font-size:25px;font-weight:700}.s{font-size:19px}.t{font-size:16px}.card{stroke-width:2;rx:14}.g{fill:#eaf2ff;stroke:#4777ae}.c{fill:#fff6df;stroke:#c28b20}.l{fill:#edf8ef;stroke:#4c8a5c}.d{fill:#f4edfb;stroke:#8058a5}</style>
<text x="40" y="42" class="h">四种并列的优化方向：少算、少存、少读、少更新</text>
<rect x="40" y="90" width="220" height="200" class="card g"/><text x="150" y="130" text-anchor="middle" class="s">Gated Attention</text><text x="60" y="170" class="t">保留 SDPA</text><text x="60" y="198" class="t">在输出后加门控</text><text x="60" y="226" class="t">抑制无效头/激活</text><text x="60" y="264" class="t">缓解 sink 与异常激活</text>
<rect x="330" y="90" width="220" height="200" class="card c"/><text x="440" y="130" text-anchor="middle" class="s">MLA</text><text x="350" y="170" class="t">KV → 共享低秩 latent</text><text x="350" y="198" class="t">缓存 latent 而非完整 K/V</text><text x="350" y="226" class="t">内容与位置分支分开</text><text x="350" y="264" class="t">减少 KV-cache 容量</text>
<rect x="620" y="90" width="220" height="200" class="card l"/><text x="730" y="130" text-anchor="middle" class="s">GDN / KDA</text><text x="640" y="170" class="t">KV 序列 → 有限状态</text><text x="640" y="198" class="t">门控 + delta 更新记忆</text><text x="640" y="226" class="t">线性复杂度读取状态</text><text x="640" y="264" class="t">适合长序列混合架构</text>
<rect x="910" y="90" width="220" height="200" class="card d"/><text x="1020" y="130" text-anchor="middle" class="s">DSA / CSA / HCA / SWA</text><text x="930" y="170" class="t">只选一部分 token</text><text x="930" y="198" class="t">索引、压缩、重排</text><text x="930" y="226" class="t">或保留滑动窗口</text><text x="930" y="264" class="t">减少主注意力读取量</text>
<text x="600" y="350" text-anchor="middle" class="t">它们可以组合：门控控制信息流，压缩改变存储表示，稀疏选择当前读取范围</text>
</svg>
