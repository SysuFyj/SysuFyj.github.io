<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">注意力机制的三条并列优化路线</title>
<desc id="desc">MLA 压缩每个 token 的缓存；Gated Attention、GDN 与 KDA 使用门控或递归状态；DSA、CSA、HCA 与 SWA 选择或压缩历史。三条路线可以组合，无先后依赖。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18212b}.h{font-size:28px;font-weight:700}.s{font-size:23px;font-weight:600}.t{font-size:21px}.card{stroke-width:2;rx:14}</style>
<text x="32" y="44" class="h">三条并列路线：改变缓存、状态与读取范围</text>
<rect x="32" y="76" width="896" height="118" class="card" fill="#eaf2ff" stroke="#4777ae"/>
<text x="56" y="112" class="s">MLA · 低秩缓存</text>
<text x="56" y="147" class="t">hidden state → latent，压缩每个 token 的存储维度</text>
<text x="56" y="178" class="t">矩阵吸收：直接在 latent 空间匹配，省去完整 K/V 的重建</text>
<rect x="32" y="210" width="896" height="118" class="card" fill="#fff6df" stroke="#c28b20"/>
<text x="56" y="246" class="s">Gated Attention / GDN / KDA · 门控与递归状态</text>
<text x="56" y="281" class="t">Gated Attention：门控注意力输出，控制信息流</text>
<text x="56" y="312" class="t">GDN / KDA：门控更新有限状态，融合历史信息</text>
<rect x="32" y="344" width="896" height="118" class="card" fill="#edf8ef" stroke="#4c8a5c"/>
<text x="56" y="380" class="s">DSA / CSA / HCA / SWA · 稀疏与压缩历史</text>
<text x="56" y="415" class="t">DSA：相关性筛选；SWA：固定窗口</text>
<text x="56" y="446" class="t">CSA：压缩后稀疏选择；HCA：重度压缩后全局读取</text>
<text x="480" y="511" text-anchor="middle" class="t">三条路线可组合；门控、缓存压缩和稀疏选择承担不同作用</text>
</svg>
